<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Aster Companion</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    html, body {
      background: transparent;
      overflow: hidden;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      height: 100vh;
      width: 100vw;
      padding: 10px;
      color: #e4e4e7;
    }

    #drag-header {
      width: 100%;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      margin-bottom: 4px;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    #drag-header:active { cursor: grabbing; }

    .status-pill {
      pointer-events: none;
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #c4b5fd;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.9), 0 0 10px rgba(139, 92, 246, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #8b5cf6;
      box-shadow: 0 0 8px #8b5cf6;
    }
    .dot.kaida { background: #38bdf8; box-shadow: 0 0 8px #38bdf8; }

    #speech-bubble {
      background: rgba(13, 11, 20, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(139, 92, 246, 0.45);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.65), inset 0 0 12px rgba(139, 92, 246, 0.08);
      border-radius: 14px 14px 4px 14px;
      padding: 10px 13px;
      width: 100%;
      max-height: 145px;
      overflow-y: auto;
      margin-bottom: 6px;
      font-size: 12.5px;
      line-height: 1.42;
      color: #f4f4f5;
      z-index: 5;
      transition: border-color 0.25s ease, opacity 0.28s ease, transform 0.28s ease;
    }
    #speech-bubble::-webkit-scrollbar { width: 4px; }
    #speech-bubble::-webkit-scrollbar-thumb { background: rgba(139, 92, 246, 0.4); border-radius: 4px; }

    #aster-wrapper {
      position: relative;
      width: 100%;
      height: 335px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin: 0 auto;
      transform-origin: bottom center;
      animation: breathe 3.4s ease-in-out infinite;
      transition: filter 0.8s ease;
      cursor: grab;
      z-index: 1;
    }
    #aster-wrapper:active { cursor: grabbing; }
    #aster-wrapper.sleeping {
      filter: brightness(0.55) saturate(0.75);
      animation-duration: 5.5s;
    }
    #aster-wrapper.bounce {
      animation: squashJump 0.42s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    #aster-sprite {
      height: 100%;
      width: auto;
      max-width: 245px;
      display: block;
      margin: 0 auto;
      object-fit: contain;
      object-position: bottom center;
      pointer-events: none;
      filter: drop-shadow(0 6px 14px rgba(0, 0, 0, 0.65));
      transform-origin: 50% 85%;
      transform: scaleX(var(--flip, 1)) rotate(var(--tilt, 0deg));
      transition: transform 0.08s linear;
    }
    #aster-sprite.dragging-pendulum {
      transform-origin: 55% 4%;
      transition: none;
    }

    #input-box {
      position: relative;
      z-index: 10;
      width: 100%;
      display: flex;
      align-items: center;
      background: rgba(13, 11, 20, 0.96);
      border: 1px solid rgba(161, 161, 170, 0.35);
      border-radius: 10px;
      padding: 4px;
      margin-top: 4px;
      transition: opacity 0.28s ease, transform 0.28s ease;
    }
    #input-box:focus-within { border-color: #8b5cf6; }

    .ui-hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      transform: translateY(6px);
    }

    #mic-indicator {
      position: absolute;
      bottom: 8px;
      right: 36px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.85);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 8;
    }
    #mic-indicator.active {
      opacity: 1;
      animation: micPulse 1.6s ease-in-out infinite;
    }
    @keyframes micPulse {
      0%, 100% { transform: scale(1); opacity: 0.85; }
      50%      { transform: scale(1.25); opacity: 1; }
    }

    .pat-particle {
      position: absolute;
      pointer-events: none;
      font-size: 16px;
      color: #c4b5fd;
      text-shadow: 0 0 10px rgba(167, 139, 250, 0.9), 0 2px 4px rgba(0, 0, 0, 0.8);
      animation: patFloat 1.15s ease-out forwards;
      z-index: 12;
    }
    @keyframes patFloat {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
      20%  { opacity: 1; transform: translate(var(--dx, 0px), -14px) scale(1.1); }
      100% { opacity: 0; transform: translate(calc(var(--dx, 0px) * 1.8), -58px) scale(0.85); }
    }

    #mic-btn {
      background: rgba(139, 92, 246, 0.15);
      color: #c4b5fd;
      border: 1px solid rgba(139, 92, 246, 0.35);
      border-radius: 7px;
      padding: 5px 8px;
      margin-right: 4px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    #mic-btn.listening {
      background: rgba(239, 68, 68, 0.25);
      border-color: #ef4444;
      color: #fca5a5;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.45);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f4f4f5;
      font-size: 12px;
      padding: 6px;
      user-select: text;
    }
    #user-input::placeholder { color: #71717a; }

    #send-btn {
      background: linear-gradient(135deg, #6d28d9, #4c1d95);
      color: #f5f3ff;
      border: 1px solid rgba(196, 181, 253, 0.3);
      border-radius: 7px;
      padding: 6px 10px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    #send-btn:hover { filter: brightness(1.15); }

    @keyframes breathe {
      0%, 100% { transform: scaleY(1) scaleX(1) translateY(0); }
      50%      { transform: scaleY(1.015) scaleX(0.992) translateY(-2px); }
    }

    @keyframes squashJump {
      0%   { transform: scaleY(1) scaleX(1) translateY(0); }
      30%  { transform: scaleY(0.93) scaleX(1.05) translateY(4px); }
      65%  { transform: scaleY(1.04) scaleX(0.97) translateY(-10px); }
      100% { transform: scaleY(1) scaleX(1) translateY(0); }
    }
  </style>
</head>
<body>
  <div id="drag-header" data-tauri-drag-region>
    <div class="status-pill">
      <span id="mode-dot" class="dot"></span>
      <span id="mode-label">Aster • Tauri</span>
    </div>
  </div>

  <div id="speech-bubble">
    <div id="speech-text">Tô na área, Kio. Digita aí ou clica no microfone pra me chamar por voz.</div>
  </div>

  <div id="aster-wrapper" title="Clique para abrir/fechar chat • Arraste para mover">
    <img id="aster-sprite" src="sprites/aster_idle.png" alt="Aster" />
    <span id="mic-indicator" title="Microfone ativo"></span>
  </div>

  <div id="input-box">
    <button id="mic-btn" title="Ligar/Desligar escuta por voz ('Aster...')">🎤</button>
    <input id="user-input" type="text" placeholder="Falar com Aster..." autocomplete="off" />
    <button id="send-btn">Enviar</button>
  </div>

  <script src="app.js"></script>
</body>
</html>
